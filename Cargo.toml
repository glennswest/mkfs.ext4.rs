[package]
name = "mkfs-ext4"
version = "2.1.0"
edition = "2021"
authors = ["Glenn West"]
description = "Async, parallel ext2/ext3/ext4 formatter and checker in pure Rust — a from-scratch reimplementation of mke2fs and e2fsck"
repository = "https://github.com/glennswest/mkfs.ext4.rs"
license = "MIT OR Apache-2.0"
rust-version = "1.75"
keywords = ["ext4", "mkfs", "filesystem", "fsck", "async"]
categories = ["filesystem", "asynchronous"]

[lib]
name = "mkfs_ext4"
path = "src/lib.rs"

[dependencies]
# Async runtime. The crate needs only these features; a consumer running a
# full tokio (stormblock does) is unaffected.
# "time" is for the MMP protocol's waits, which are the mechanism
# rather than an optimisation.
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync", "macros", "time"], optional = true }
async-trait = { version = "0.1", optional = true }
futures = { version = "0.3", optional = true }

# CRC32c drives every metadata_csum checksum; crc16 for legacy GDT_CSUM is
# implemented here since no crate matches the ext4 polynomial usage exactly.
crc32c = { version = "0.6", optional = true }

uuid = { version = "1", features = ["v4"], optional = true }
thiserror = { version = "2", default-features = false }
bitflags = { version = "2", default-features = false }
tracing = { version = "0.1", optional = true }

# CLI binaries only.
clap = { version = "4", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
anyhow = { version = "1", optional = true }

[dev-dependencies]
# "test-util" gives the paused clock the MMP tests need.
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
# The golden reference filesystems are stored compressed.
flate2 = "1"

[features]
default = ["std", "cli"]

# The async formatter, checker and device layer. On by default, so every
# existing consumer is unaffected. Turning it off leaves the synchronous
# `read` path and the on-disk structures — which is what a UEFI driver links,
# since it has no allocator beyond `alloc`, no runtime and no `std`.
std = ["dep:tokio", "dep:async-trait", "dep:futures", "dep:uuid", "dep:tracing", "dep:crc32c"]
# The mkfs.ext4 / fsck.ext4 binaries. Library consumers turn this off.
cli = ["std", "dep:clap", "dep:tracing-subscriber", "dep:anyhow", "tokio/rt-multi-thread"]

# Rust will not accept a "." in a crate name, so the binaries build as
# mkfs-ext4 and fsck-ext4. Install them as mkfs.ext4 and fsck.ext4 — that is
# the name `mkfs -t ext4` and `fsck -t ext4` dispatch on.
[[bin]]
name = "mkfs-ext4"
path = "src/bin/mkfs_ext4.rs"
required-features = ["cli"]

[[bin]]
name = "fsck-ext4"
path = "src/bin/fsck_ext4.rs"
required-features = ["cli"]

[profile.release]
lto = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }
